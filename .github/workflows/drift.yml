name: drift

# Manual only. To run weekly, add the repository secrets listed under `env` and
# `credentials_json`, then add a schedule trigger under `on`, for example:
#   schedule:
#     - cron: "0 6 * * 1"
on:
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: global
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Sync environment
        run: uv sync --locked --all-groups

      - name: Run, judge and compare with the previous snapshot
        run: |
          previous=$(ls results | sort | tail -n 1)
          uv run bench run
          current=$(ls results | sort | tail -n 1)
          uv run bench judge --snapshot "$current"
          uv run bench report --snapshot "$current"
          uv run bench drift "$previous" "$current" | tee "results/$current/DRIFT.md"

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: results/
