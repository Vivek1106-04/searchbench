[run]
k = 5
# Same context budget for every vendor: content is cut after normalization.
max_content_chars = 2000
# The runner stops cleanly once estimated spend crosses this.
max_spend_usd = 10.0
# Retries on 429 and 5xx, including the first attempt.
max_attempts = 3

[vendors.tavily]
# Free tier allows 100 requests per minute.
concurrency = 4
requests_per_second = 1.5

[vendors.exa]
# Default limit is 10 queries per second.
concurrency = 4
requests_per_second = 2.0

[vendors.firecrawl]
# Free tier allows 10 requests per minute and 2 concurrent requests.
concurrency = 2
requests_per_second = 0.15

[judge]
primary_model = "gemini-3.1-pro-preview"
second_model = "gemini-3.5-flash-lite"
seed = 1
temperature = 0.0
