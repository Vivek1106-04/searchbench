[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "searchbench"
version = "0.1.0"
description = "Independent, reproducible benchmark of web search APIs for LLM agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Vivek Gangavarapu" }]
keywords = ["search", "benchmark", "llm", "agents", "llm-as-judge"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "google-genai>=1.0",
    "httpx>=0.28",
    "numpy>=2.1",
    "pydantic>=2.10",
    "typer>=0.15",
]

[project.scripts]
bench = "searchbench.cli:app"

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/searchbench"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "SIM",       # simplify
  "PTH",       # pathlib
  "RET",       # returns
  "ARG",       # unused arguments
  "TRY",       # tryceratops
  "RUF",
]
ignore = [
  "TRY003",  # long messages outside exception class: we prefer readable errors
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["src/searchbench"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
  "if __name__ == .__main__.:",
]
